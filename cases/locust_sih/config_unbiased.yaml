# 无偏 corpus 运行配置：1349 篇 PubMed Level 2 query 结果
#
# 用途：
#   - 策略 A（query-driven）：验证 NPF/DH/AT 能否在无偏 corpus 上独立浮上来
#   - 与 biased corpus (output_real) 对比，量化 confirmation bias
#   - 论文 Figure 2 的数据基础
#
# 运行：
#   python tools/extract_unbiased.py cases/locust_sih/config_unbiased.yaml --limit 20   # smoke
#   python tools/extract_unbiased.py cases/locust_sih/config_unbiased.yaml              # 全量

study:
  topic: "starvation-induced hyperactivity"
  target_species: "Locusta migratoria"
  reference_species:
    - "Drosophila melanogaster"
  entity_type: "neuropeptide"
  behavior: "locomotor"
  master_list: "cases/locust_sih/neuropeptide_master_list.md"   # core_name 规范化主表

search:
  # 无偏 corpus：从 JSON 加载（由 tools/fetch_unbiased_corpus.py 产出）
  papers_json: "cases/locust_sih/unbiased_papers.json"
  use_pubmed: false
  date_range: [2000, 2026]
  max_results: 1349

# screening 跳过（选项 A）：直接 extract，extract 自带过滤
screening:
  enabled: false

extraction:
  llm:
    provider: "deepseek"
    model: "deepseek-chat"
    api_key_env: "DEEPSEEK_API_KEY"
  prompt_file: "prompts/extraction_prompt.txt"
  prompt_file_review: "prompts/extraction_prompt_review.txt"
  evidence_levels:
    - transcript
    - peptide
    - release
    - functional
    - review_mention
  weights:
    transcript: 1
    peptide: 2
    release: 3
    functional: 4
    review_mention: 0.25
  max_tokens: 4096
  temperature: 0.0
  # 并发控制（全量跑时启用）
  concurrent: 8

homolog:
  method: "BLAST"
  database: "UniProt"
  min_identity: 0.4
  min_coverage: 0.5
  require_ortholog: false

scoring:
  min_studies: 2
  weight_convergence: 0.5
  weight_level: 0.5
  top_n: 30
  type_filter:
    enabled: true   # 杠杆 2：过滤 receptor/enzyme/drug/metabolite/noise，保留信号分子
  normalization:
    enabled: true   # core_name 规范化（合并 AT/allatotropin、FMRFa/FMRFamide 等同义词）

output:
  dir: "output_unbiased"
  table: "candidates_ranked.xlsx"
  evidence_detail: "evidence_detail.xlsx"
  database: "evidence_db.json"
  report: "report.md"
